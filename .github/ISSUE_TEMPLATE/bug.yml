name: Bug report
description: Report a component or platform bug
body:
  - type: input
    id: component
    attributes:
      label: Component / page
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
